<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v2ray 订阅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333;padding:20px}
.c{max-width:600px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h1{font-size:20px;margin-bottom:8px}
.st{color:#888;font-size:13px;margin-bottom:12px}
.url{background:#f0f6ff;border:1px solid #d0e0ff;border-radius:8px;padding:12px;margin:8px 0;word-break:break-all;font-family:monospace;font-size:12px;color:#0066cc}
.btn{background:#0066cc;color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px;margin-top:4px}
.tip{background:#fffbe6;border:1px solid #ffe58f;border-radius:8px;padding:12px;font-size:12px;color:#614700;margin-top:8px}
</style>
</head>
<body>
<div class="c">
<div class="card">
<h1>v2ray 订阅</h1>
<p class="st">每日自动更新 | 来源: wenpblog.com</p>
<div class="url" id="sub">加载中...</div>
<button class="btn" onclick="copy('sub')">复制订阅地址</button>
<div class="tip">
<strong>使用方法：</strong><br>
1. 复制上方订阅地址<br>
2. 打开 v2rayNG/Shadowrocket<br>
3. 添加订阅 → 粘贴地址 → 更新
</div>
</div>
<div class="card">
<h1>原始节点</h1>
<p class="st">每行一个节点URI</p>
<div class="url" id="nodes">加载中...</div>
<button class="btn" onclick="copy('nodes')">复制节点列表</button>
</div>
</div>
<script>
var base = window.location.origin + window.location.pathname.replace(/index\.html$/,'');
document.getElementById('sub').textContent = base + 'v2ray_sub.txt';
document.getElementById('nodes').textContent = base + 'v2ray_nodes_raw.txt';
function copy(id){
  var t=document.getElementById(id).innerText;
  navigator.clipboard.writeText(t).then(function(){
    var b=event.target;b.innerText='已复制!';setTimeout(function(){b.innerText='复制订阅地址'},1500);
  });
}
fetch(base+'status.json').then(r=>r.json()).then(d=>{
  var st=document.querySelector('.st');st.innerText='更新时间: '+d.last_update+' | 节点数: '+d.node_count;
}).catch(()=>{});
</script>
</body>
</html>
